# Optional. Not started by `npm run dev`.
# Needs an NVIDIA GPU and the NVIDIA container runtime.
# The image entrypoint is the OpenAI-compatible server.
#
#   docker compose -f docker-compose.vllm.yml up
#
# Then leave .env at VLLM_BASE_URL=http://localhost:8000/v1 and VLLM_MODEL=Qwen/Qwen3-8B.

services:
  vllm:
    image: vllm/vllm-openai:latest
    ipc: host
    ports:
      - "8000:8000"
    volumes:
      - huggingface:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --model
      - Qwen/Qwen3-8B
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      - --reasoning-parser
      - qwen3
      - --max-model-len
      - "16384"

volumes:
  huggingface:
